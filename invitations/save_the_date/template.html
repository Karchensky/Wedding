<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date — Emily & Bryan</title>
    <style>
        body { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 17px; line-height: 1.65; color: #2c2c2c; background: #f5f0e8; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 32px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
        .card-body { padding: 36px 32px 40px; }
        .code-box { background: #f8f4ee; border: 1px solid #d4c4a8; border-radius: 8px; padding: 16px; margin: 22px 0; font-family: monospace; font-size: 19px; text-align: center; color: #4a3728; }
        a { color: #6b5344; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="card-body">
                <h1>Save the Date</h1>
                <p>Emily & Bryan — May 2027 · Castello del Trebbio, Tuscany</p>
                <p>Your invite code: <span class="code-box">{{INVITE_CODE}}</span></p>
                <p>More details to follow.</p>
            </div>
        </div>
    </div>
</body>
</html>
